# Testes de mutação (Stryker) do projeto todo. Demora bem mais que o CI, por isso não roda em todo PR:
# roda nos PRs para a main (release), toda segunda-feira e sob demanda. Detalhes em docs/testes.md.
name: Mutação

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mutation:
    name: Testes de mutação (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      # Falha se o mutation score ficar abaixo do "break" do stryker.config.mjs.
      - name: Stryker
        run: npm run test:mutation

      - name: Publica o relatório
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14
