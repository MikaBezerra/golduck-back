# Entrega contínua: push na develop publica o ambiente develop; push na main, a produção.
# As migrações rodam ANTES do deploy, para o código novo nunca subir antes do banco.
#
# Desligado até a variável DEPLOY_ENABLED ser "true" (Settings > Variables). Requer:
# - Environments "develop" e "production" com os secrets DOTENV_PRIVATE_KEY_DEVELOP e
#   DOTENV_PRIVATE_KEY_PRODUCTION (do .env.keys local);
# - secret VERCEL_TOKEN e variables VERCEL_ORG_ID e VERCEL_PROJECT_ID;
# - deploy automático por Git desligado na Vercel (quem publica é este workflow).
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_CLI: vercel@65.12.1

jobs:
  deploy:
    name: Migrações e deploy
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    env:
      APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
      VERCEL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      VERCEL_PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      DOTENV_PRIVATE_KEY_DEVELOP: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOP }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Aplica as migrações no banco do ambiente
        run: npm run db:migrate:${{ env.APP_ENV }}

      - name: Baixa a configuração do projeto na Vercel
        run: npx --yes ${{ env.VERCEL_CLI }} pull --yes --environment=${{ env.VERCEL_ENVIRONMENT }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build para a Vercel
        run: npx --yes ${{ env.VERCEL_CLI }} build ${{ env.VERCEL_PROD_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publica na Vercel
        run: npx --yes ${{ env.VERCEL_CLI }} deploy --prebuilt ${{ env.VERCEL_PROD_FLAG }} --token=${{ secrets.VERCEL_TOKEN }}
