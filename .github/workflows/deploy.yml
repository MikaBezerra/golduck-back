# Entrega contínua: push na develop atualiza o ambiente develop; push na main, a produção.
# As migrações rodam ANTES do deploy, para o código novo nunca subir antes do banco.
#
# - Migrações: rodam sempre. Requerem os environments "develop" e "production" com os secrets
#   DOTENV_PRIVATE_KEY_DEVELOP e DOTENV_PRIVATE_KEY_PRODUCTION (do .env.keys local).
# - Deploy na Vercel: desligado até a variável DEPLOY_ENABLED ser "true" (Settings > Variables).
#   Cada ambiente tem o seu projeto na Vercel (golduck-back-develop e golduck-back), sempre publicado
#   como produção daquele projeto: URL fixa e sem a proteção dos deploys de preview.
#   Requer o secret VERCEL_TOKEN e a variable VERCEL_ORG_ID no repositório, e a variable
#   VERCEL_PROJECT_ID em cada environment. O vercel.json desliga o deploy automático por Git.
name: Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
  VERCEL_CLI: vercel@65.12.1

jobs:
  migrate:
    name: Migrações
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    env:
      DOTENV_PRIVATE_KEY_DEVELOP: ${{ secrets.DOTENV_PRIVATE_KEY_DEVELOP }}
      DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Aplica as migrações no banco do ambiente
        run: npm run db:migrate:${{ env.APP_ENV }}

  deploy:
    name: Deploy na Vercel
    needs: migrate
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instala dependências
        run: npm ci

      - name: Baixa a configuração do projeto na Vercel
        run: npx --yes ${{ env.VERCEL_CLI }} pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build para a Vercel
        run: npx --yes ${{ env.VERCEL_CLI }} build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # GIT_COMMIT_SHA identifica o commit publicado nos logs e em GET /api/version.
      - name: Publica na Vercel
        run: npx --yes ${{ env.VERCEL_CLI }} deploy --prebuilt --prod --env GIT_COMMIT_SHA=${{ github.sha }} --token=${{ secrets.VERCEL_TOKEN }}
