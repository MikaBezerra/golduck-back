# THIS DOCKERFILE IS INTENDED FOR DEVELOPMENT ENVIRONMENTS
# DO NOT USE THIS FOR PRODUCTION USAGES.

services:
  postgresql:
    image: postgres:18
    command: ['postgres', '-c', 'timezone=UTC']
    ports:
      - '5433:5432'
    volumes:
      - 'postgresql_data_official:/var/lib/postgresql'
    environment:
      - POSTGRES_DB=financas
      - POSTGRES_USER=mikaell
      - POSTGRES_PASSWORD=password

volumes:
  postgresql_data_official:
    driver: local
